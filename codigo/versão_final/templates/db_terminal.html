<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Terminal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #0c0c0c;
            color: #ddd;
            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;

            display: flex;
            flex-direction: column;
        }

        #terminal {
            flex: 1;
            overflow-y: auto;
            padding: 15px;

            white-space: pre-wrap;
        }

        #input-line {
            display: flex;
            padding: 10px 15px;

            border-top: 1px solid #333;
        }

        #prompt {
            color: #00ff66;
            margin-right: 8px;
        }

        #command {
            flex: 1;

            background: none;
            border: none;
            outline: none;

            color: #fff;
            font-family: inherit;
            font-size: inherit;
        }

        .input {
            color: #00ff66;
        }

        .error {
            color: #ff3333;
        }
    </style>
</head>

<body>

<div id="terminal"></div>

<div id="input-line">
    <span id="prompt">db&gt;</span>
    <input
        id="command"
        type="text"
        autocomplete="off"
        autofocus
        placeholder=""
    >
</div>

<script src="{{ url_for('static', filename='js/terminal.js') }}"></script>
</body>
</html>
